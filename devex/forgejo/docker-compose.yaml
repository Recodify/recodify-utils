version: "3.8"

services:
  forgejo:
    image: codeberg.org/forgejo/forgejo:1.21
    container_name: forgejo
    restart: unless-stopped

    environment:
      - USER_UID=1000
      - USER_GID=1000

    ports:
      - "3000:3000"   # Web UI
      - "2222:22"     # SSH for git

    volumes:
      - ./forgejo-data:/data

    networks:
      - forgejo-net

networks:
  forgejo-net:
